name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # spyscan scans Windows (processes, services, PE files), so its tests run there.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the minimum (pyproject); 3.14 is what the app is built and run with
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
