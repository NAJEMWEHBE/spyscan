[project]
name = "spyscan"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Local-only Windows spyware/surveillance awareness scanner (defensive)."
requires-python = ">=3.13"
dependencies = ["psutil>=5.9", "pefile>=2023.2.7", "flask>=3.0", "pywebview>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spyscan = "spyscan.cli:main"
spyscan-app = "spyscan.app.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the vanilla UI assets and the IOC indicator lists inside the package so
# the app works from an installed wheel / a PyInstaller bundle (no build step).
"spyscan.app" = ["ui/*.html", "ui/*.css", "ui/*.js"]
"spyscan.rules" = ["indicators/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: hits the real OS; skipped by default"]
addopts = "-m 'not integration'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
